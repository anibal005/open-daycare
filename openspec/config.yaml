schema: spec-driven

# Project context (optional)
context: |
  OpenDayCare es una app web para la gestión diaria de una guardería: feed de
  publicaciones del staff, niños y salas, padres vinculados e invitaciones por
  email. La UI va en español rioplatense y el código en inglés.

